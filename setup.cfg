# Python lint and formatting settings aligned with kanata_common.
[flake8]
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202,CNL100,E203,E501,Q000
application-import-names = kanata_ros2_pkg_generator
import-order-style = pep8
max-line-length = 100
show-source = true
statistics = true

[isort]
profile = black
line_length = 100
force_sort_within_sections = true
force_single_line = true
reverse_relative = true
known_first_party = kanata_ros2_pkg_generator
